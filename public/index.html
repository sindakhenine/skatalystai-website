      name="twitter:description"
      content="Turn messy business data into structured databases, documentation, dashboards, and apps you fully own."
    />
    <meta name="twitter:image" content="https://skatalystai.com/social-preview.png" />

    <script>
      (function (location) {
        if (!location.search.startsWith("?/")) {
          return;
        }

        var decoded = location.search
          .slice(2)
          .split("&")
          .map(function (part) {
            return part.replace(/~and~/g, "&");
          })
          .join("?");

        window.history.replaceState(
          null,
          "",
          location.pathname + decoded + location.hash
        );
      })(window.location);
    </script>
    <title>SKatalyst AI | Turn Messy Data Into Systems You Own</title>
